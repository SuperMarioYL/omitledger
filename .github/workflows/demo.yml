name: demo
# Manual refresh only — the committed assets/demo.gif is the source of truth
# (Decision D3). A flaky render must never fail a release, so this does NOT
# trigger on tag push.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  vhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build the omitledger binary onto PATH
        run: |
          go build -o omitledger ./cmd/omitledger
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Install vhs + ttyd + ffmpeg (apt — vhs-action's self-install is flaky)
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list >/dev/null
          sudo apt-get update && sudo apt-get install -y vhs ttyd ffmpeg

      - name: Render the demo tape
        run: vhs docs/demo.tape   # writes assets/demo.gif per the tape's Output line

      - name: Commit the refreshed gif
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add assets/demo.gif
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "chore: render demo gif"
          git push origin HEAD:${{ github.ref_name }}
