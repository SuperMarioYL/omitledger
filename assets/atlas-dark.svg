<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="Architecture: Coding Agent → omitledger CLI → SQLite ledger, with reopen re-injecting into the next session">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#1D1D1F"/>

  <!-- forward connectors: static base lines -->
  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="210" y1="180" x2="310" y2="180" marker-end="url(#ah-d)"/>
    <line x1="530" y1="180" x2="630" y2="180" marker-end="url(#ah-d)"/>
  </g>
  <!-- marching-dash data flow (forward: agent → cli → store) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="210" y1="180" x2="306" y2="180" stroke="#8985FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="530" y1="180" x2="626" y2="180" stroke="#4DA3FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- data packets along the forward flow -->
  <g>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M210,180 L306,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#4DA3FF">
      <animateMotion path="M530,180 L626,180" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- reopen return path (store → next agent session) -->
  <path d="M755,220 C755,300 125,300 125,220" stroke="#3A3A44" stroke-width="1.5" fill="none" marker-end="url(#ah-d)"/>
  <path d="M755,220 C755,300 125,300 125,220" stroke="#2DC79A" stroke-opacity="0.5" stroke-width="1.5" fill="none" stroke-dasharray="6 10">
    <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.8s" begin="-0.4s" repeatCount="indefinite"/>
  </path>
  <circle r="3" fill="#2DC79A">
    <animateMotion dur="3.6s" begin="-1.5s" repeatCount="indefinite" path="M755,220 C755,300 125,300 125,220"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="3.6s" begin="-1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="440" y="322" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">reopen → next agent session (re-inject, m3)</text>

  <!-- nodes -->
  <g>
    <rect x="40" y="140" width="170" height="80" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#8985FF">Coding Agent</text>
    <text x="125" y="196" text-anchor="middle" font-size="11" fill="#A1A1A8">Claude · Cursor</text>

    <rect x="355" y="140" width="170" height="80" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#4DA3FF">omitledger CLI</text>
    <text x="440" y="196" text-anchor="middle" font-size="11" fill="#A1A1A8">cobra · 1 binary</text>

    <rect x="670" y="140" width="170" height="80" rx="15" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="755" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#2DC79A">SQLite ledger</text>
    <text x="755" y="196" text-anchor="middle" font-size="11" fill="#A1A1A8">.omitledger</text>
  </g>
</svg>
